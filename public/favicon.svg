<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>
  <!-- legs from each point to the center -->
  <g stroke="#ffffff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round">
    <line x1="16" y1="18" x2="31" y2="31"/>
    <line x1="49" y1="14" x2="33" y2="30"/>
    <line x1="41" y1="51" x2="33" y2="33"/>
  </g>
  <!-- three points converging -->
  <circle cx="15" cy="17" r="6" fill="#ffffff"/>
  <circle cx="50" cy="13" r="6" fill="#ffffff"/>
  <circle cx="42" cy="52" r="6" fill="#ffffff"/>
  <!-- the fair center -->
  <circle cx="32" cy="31" r="8" fill="#4ade80" stroke="#4f46e5" stroke-width="3"/>
</svg>
